name: 'shapegrid - Activity Grid Generator'
description: 'Generate a 3D-rendered activity grid from GitHub contributions and commit it to your repository'
author: 'shapegrid'

branding:
  icon: 'grid'
  color: 'green'

inputs:
  github-token:
    description: 'GitHub personal access token with read:user scope'
    required: true
  username:
    description: 'GitHub username to visualise'
    required: true
  config:
    description: 'Path to shapegrid config YAML'
    required: false
    default: 'shapegrid.config.yml'
  output-dir:
    description: 'Output directory for generated files'
    required: false
    default: 'dist'
  commit-message:
    description: 'Commit message for auto-committed assets'
    required: false
    default: 'chore: update shapegrid activity grid [skip ci]'
  auto-commit:
    description: 'Commit generated assets back to repo'
    required: false
    default: 'true'
  deploy-pages:
    description: 'Deploy to GitHub Pages'
    required: false
    default: 'false'

outputs:
  svg-path:
    description: 'Path to the generated SVG file'
    value: ${{ steps.generate.outputs.svg-path }}
  json-path:
    description: 'Path to the generated JSON data file'
    value: ${{ steps.generate.outputs.json-path }}

runs:
  using: 'node20'
  main: 'packages/action/dist/index.js'

# shapegrid.config.yml
# Full configuration reference for the shapegrid activity grid generator.
# Copy this file to your repository root and customise the values below.

# ─── GitHub credentials ───────────────────────────────────────────────────────
github:
  # Your GitHub username
  username: Wolren

  # Personal Access Token with `read:user` scope.
  # The value is the name of an environment variable (recommended) or a literal token.
  token: SHAPEGRID_TOKEN

# ─── Boundary shape ───────────────────────────────────────────────────────────
boundary:
  # Use one of:
  #
  # 1. Named preset: circle | shield | star | diamond | heart | rectangle | hexagon | arrow | cross
  # type: preset
  # name: shield

  # 2. Country/region by ISO 3166-1 alpha-2 code (e.g., US, GB, FR, DE, JP, AU)
  # type: country
  # code: US

  # 3. Raw polygon points (normalised 0–1 coordinates)
  # type: polygon
  # points:
  #   - [0.5, 0.0]
  #   - [1.0, 0.25]
  #   - [1.0, 0.75]
  #   - [0.5, 1.0]
  #   - [0.0, 0.75]
  #   - [0.0, 0.25]

  # 4. SVG path string (M/L/Z commands, absolute coordinates)
  # type: svgPath
  # d: "M 50 0 L 100 25 L 100 75 L 50 100 L 0 75 L 0 25 Z"

  # 5. GeoJSON polygon ring
  # type: geojson
  # coordinates:
  #   - [0.5, 0.0]
  #   - [1.0, 0.5]
  #   - [0.5, 1.0]
  #   - [0.0, 0.5]
  # coordinateSystem: auto  # auto | planar | wgs84 | mercator
  #                        # Use wgs84/mercator for lon/lat GeoJSON to avoid warping.

  # 6. External file (GeoJSON or SVG)
  type: file
  path: ./boundary-export.json
  format: geojson   # or "svg" (auto-detected from extension if omitted)
  coordinateSystem: planar  # only used for GeoJSON files

# ─── Grid layout ──────────────────────────────────────────────────────────────
grid:
  # Cell shape: square | hex
  type: square

  # Exact number of cells to place. Must equal your date range in days
  # if you want one cell per day (e.g. 365 for one year).
  count: 1095

  # How much of a cell must be inside the boundary to be included (0–1).
  # Lower values allow more border cells; higher values are stricter.
  coverageThreshold: 0.3

# ─── Camera / projection ──────────────────────────────────────────────────────
camera:
  # Horizontal rotation in degrees (-180 to 180, 0 = front, 90 = right side)
  yaw: 31.2

  # Vertical tilt in degrees (5 to 89, 0 = top-down flat, 60 = steep isometric, 90 = side)
  pitch: 40.1

  # Zoom level for SVG/PNG export (lower = more zoomed in)
  # 0.3 = tight crop, 0.5 = moderate, 1.0 = full view
  zoom: 0.8290339464282099

# ─── Visual style / Theme ─────────────────────────────────────────────────────
theme:
  # Colour palette: github | warm | cool | mono | neon | forest | sunset | ocean | fire | pastel | arctic | gold
  # Or define custom palette with colors array (minimum 2 colors, will be interpolated)
  palette: pastel
  
  # Border color for empty days (no contributions). When set, empty days render
  # as border-only instead of filled. Useful on light backgrounds.
  # Left empty on purpose: the dark theme fills empty days with the flat floor
  # colour, which reads as a solid surface instead of a white mesh.
  # Example: "#cccccc" for light gray on white, "#ffffff" for white on dark
  # dayBorder: "#ffffff"
  
  # Custom palette example (uncomment to use instead of built-in palette):
  # customPalette:
  #   name: "My Custom Theme"
  #   colors:
  #     - "#1a0a00"
  #     - "#7a2e00"
  #     - "#c05000"
  #     - "#e88030"
  #     - "#ffe0b0"

# ─── Coordinate Axes (for geographic data) ───────────────────────────────────
axes:
  # Show coordinate axes (longitude/latitude labels)
  # If omitted, defaults to true when using wgs84/mercator coordinate systems
  enabled: true
  
  # Position axes outside or inside the grid boundary
  # Options: outside | inside
  position: outside
  
  # Distance from grid edge to axis line (in normalized grid units, 0.01 to 0.2)
  # Higher values push axes further from the grid
  distance: 0.04
  
  # Axis line color (CSS hex)
  lineColor: "#666666"
  
  # Label text color (CSS hex)
  labelColor: "#888888"
  
  # Font family for axis labels
  labelFont: "IBM Plex Mono, monospace"
  
  # Label size scale multiplier (0.3 to 3.0, default: 1.0)
  labelScale: 1.0

# ─── Render settings ──────────────────────────────────────────────────────────
render:

  # Height extrusion multiplier. 0 = flat, 1 = normal, 2 = tall bars (0 to 3)
  heightScale: 1.0

  # Draw the boundary polygon as a wireframe outline
  showBoundary: false

  # Canvas / SVG background colour (CSS hex). Omit or set to "" for transparent.
  background: "#0d1117"

  # Gap between cells (fraction of cell size, 0.0–0.4)
  gap: 0.05

  # Intensity scale mode: linear | sqrt | cbrt | log
  # cbrt compresses extreme outliers (e.g. a single 241-contribution day)
  # so the tallest bar doesn't dominate the whole grid.
  scaleMode: cbrt

# ─── Date range ───────────────────────────────────────────────────────────────
dateRange:
  # Last N days ending today (most common)
  last: 1095

  # Or specify explicit dates:
  # start: "2024-01-01"
  # end:   "2024-12-31"

# ─── Output ───────────────────────────────────────────────────────────────────
output:
  # Directory for generated files (relative to project root)
  dir: dist

  # Filenames (omit any you don't need)
  svgFilename: shapegrid.svg
  pngFilename: shapegrid.png
  jsonFilename: shapegrid-data.json

  # Export dimensions for PNG/SVG (200 to 4096)
  width: 1200
  height: 600
# ─── Dashboard overlay widgets ─────────────────────────────────────

# Regenerates the activity grid and deploys the web viewer to GitHub Pages.
# Triggered on config changes, lockfile updates, or manual dispatch.
#
# Prerequisites:
#   1. Create a GitHub PAT with read:user scope
#   2. Add it as repo secret SHAPEGRID_TOKEN
#   3. Enable GitHub Pages (Settings > Pages > Branch: master, Folder: /docs)

name: shapegrid

on:
  push:
    branches: [master]
    paths:
      - 'shapegrid.config.yml'
      - '.github/workflows/shapegrid.yml'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'packages/**'
      - 'web/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      username:
        description: 'GitHub username to visualise (leave blank to use config)'
        required: false

permissions:
  contents: write

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Generate activity grid
        env:
          SHAPEGRID_TOKEN: ${{ secrets.SHAPEGRID_TOKEN }}
          GITHUB_USERNAME: ${{ github.event.inputs.username || github.repository_owner }}
        run: |
          node packages/core/cli/dist/index.js generate \
            --config shapegrid.config.yml \
            --user "$GITHUB_USERNAME" \
            --token SHAPEGRID_TOKEN

      - name: Stage for GitHub Pages
        run: |
          mkdir -p docs/assets
          cp web/dist/index.html docs/index.html
          cp -r web/dist/assets/* docs/assets/ 2>/dev/null || true
          cp dist/*.svg dist/*.json docs/assets/ 2>/dev/null || true

      - name: Render PNG (headless Three.js via Puppeteer)
        continue-on-error: true
        run: |
          mkdir -p /tmp/puppeteer-install
          cd /tmp/puppeteer-install
          npm init -y 2>&1 | tail -1
          npm install puppeteer 2>&1 | tail -5
          cd /home/runner/work/Shapegrid/Shapegrid
          NODE_PATH=/tmp/puppeteer-install/node_modules node scripts/render-png-ci.js docs docs/assets/shapegrid.png 1200 800

      - name: Commit and push generated assets
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/ dist/
          git diff --staged --quiet || git commit -m "chore: update shapegrid grid [skip ci]

          Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
